  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 25%, rgba(0, 155, 255, .08), transparent 34%),
        #030817;
      color: #f6f7fb;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .page {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 34px 20px 110px;
    }

    .top-badge {
      width: fit-content;
      margin: 0 auto 28px;
      padding: 13px 25px;
      border: 1px solid rgba(0, 210, 255, .55);
      border-radius: 999px;
      color: #08d9ff;
      background: rgba(4, 19, 35, .72);
      box-shadow: 0 0 25px rgba(0, 210, 255, .08);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: .2px;
    }

    .banner {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 30px;
      border: 1px solid rgba(0, 207, 255, .34);
      box-shadow:
        0 0 0 6px rgba(0, 207, 255, .05),
        0 18px 50px rgba(0, 0, 0, .48);
    }

    h1 {
      margin: 42px auto 0;
      max-width: 650px;
      text-align: center;
      font-size: clamp(32px, 6vw, 46px);
      line-height: 1.12;
      font-weight: 800;
      letter-spacing: -.8px;
    }

    h1 .gradient {
      background: linear-gradient(90deg, #00d8ff, #7d62ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      border-bottom: 2px solid rgba(0, 196, 255, .45);
    }

    .subtitle {
      margin: 36px 0 50px;
      text-align: center;
      color: #c5c9d7;
      font-size: clamp(20px, 4vw, 27px);
    }

    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 104px;
      border-radius: 58px;
      text-decoration: none;
      color: white;
      font-size: clamp(26px, 5vw, 36px);
      font-weight: 800;
      background: linear-gradient(100deg, #12b9ed 0%, #168ff5 42%, #8a55f5 100%);
      box-shadow:
        0 0 34px rgba(25, 190, 255, .28),
        inset 0 1px 0 rgba(255,255,255,.25);
      transition: transform .15s ease, filter .15s ease;
    }

    .cta:active { transform: scale(.985); }
    .cta:hover { filter: brightness(1.08); }

    .cta-arrow {
      margin-left: 16px;
      font-size: 1.1em;
      line-height: 1;
    }

    .trust {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      margin: 27px 0 72px;
      color: #a9afc1;
      font-size: 17px;
    }

    .check {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #06bfe9;
      color: #03101b;
      font-weight: 900;
      font-size: 13px;
    }

    .divider {
      height: 1px;
      background: rgba(150, 160, 185, .18);
      margin-bottom: 42px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      min-height: 115px;
      padding: 22px 10px;
      border: 1px solid rgba(150, 160, 185, .18);
      border-radius: 24px;
      background: rgba(9, 18, 38, .7);
      text-align: center;
    }

    .card strong {
      display: block;
      margin-bottom: 10px;
      font-size: 23px;
      background: linear-gradient(90deg, #00dfff, #8c61ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .card:nth-child(2) strong { color: #4d92ff; background: none; }
    .card:nth-child(3) strong { color: #bc70ff; background: none; }

    .card span {
      color: #a9afbd;
      font-size: 17px;
    }

    @media (max-width: 560px) {
      .page { padding: 38px 20px 90px; }
      .top-badge { font-size: 15px; padding: 12px 21px; }
      .banner { border-radius: 27px; }
      h1 { margin-top: 36px; }
      .subtitle { margin: 31px 0 44px; }
      .cta { min-height: 100px; }
      .trust { margin-bottom: 68px; }
      .cards { gap: 18px; }
      .card { min-height: 113px; border-radius: 22px; }
      .card strong { font-size: 20px; }
      .card span { font-size: 15px; }
    }
  </style>
</head>
